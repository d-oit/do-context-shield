# cargo-mutants configuration (read automatically from .cargo/mutants.toml).
#
# Each exclusion is pinned to a file, line, and mutation so that moving or
# rewriting the code re-surfaces the mutant for a fresh equivalence check
# instead of hiding a real gap. Only mutants with a proof of equivalence are
# listed here; every other survivor is a test gap to fix or a documented
# limitation in plans/backlog.md.
exclude_re = [
    # `> with >= in luhn_valid`: the comparison only ever sees the output of
    # `digit *= 2`, every doubled digit is even, and `> 9` and `>= 9` differ
    # exactly at 9, which doubling a digit cannot produce.
    'crates/detector-regex/src/lib\.rs:63:22: replace > with >= in luhn_valid',

    # `| with ^ in decode_hex`: the left operand is `nibble << 4` (low nibble
    # zero) and the right operand is one hex digit (high bits zero), so the
    # operands never share a set bit and `a | b == a ^ b` for every input.
    'crates/vault-json/src/encrypted\.rs:233:47: replace \| with \^ in decode_hex',

    # `delete ! in Lock::drop` → `()`: the `File` field closes when `Lock`
    # drops, and closing the handle releases the flock on Unix and Windows,
    # so the explicit no-op is observationally identical.
    'crates/vault-json/src/lib\.rs:94:9: replace <impl Drop for Lock>::drop with \(\)',

    # PrivacyPipeline::restore scan budget `passes_left = input.len() + 1`.
    # Every pass moves the cursor past one occurrence of the 13-byte prefix,
    # and occurrences of that prefix cannot overlap, so a scan performs at
    # most `len - 12` passes. The budget therefore never trips under correct
    # arithmetic, and each mutant of its initial value (`+`→`-`, `+`→`*`) or
    # its decrement (`-=`→`+=`, `-=`→`/=`) leaves every reachable behavior
    # unchanged. The budget is only observable if the cursor stalls, which the
    # current code cannot do; a test cannot force that without a fault seam.
    'crates/privacy-core/src/lib\.rs:227:43: replace \+ with [-*] in PrivacyPipeline::restore',
    'crates/privacy-core/src/lib\.rs:234:25: replace -= with [+/]= in PrivacyPipeline::restore',

    # `% with + in iban_valid` (letter branch `* 100 + expanded`): adding 97
    # is adding 0 mod 97, and every later step re-mods (`% 97` in both digit
    # and letter branches) after multiplying the carry by 10 or 100, so the
    # extra multiple of 97 is absorbed before the final `== 1` check. Verified
    # by hand (mutant applied: valid DE89 IBAN still detected, bad checksum
    # still rejected) and by brute force over DE/GB/FR/ES/IT/NL valid IBANs,
    # which all validate identically under `%` and `+`.
    'crates/detector-regex/src/lib\.rs:124:58: replace % with \+ in iban_valid',
]
