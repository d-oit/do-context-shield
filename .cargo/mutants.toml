# cargo-mutants configuration (read automatically from .cargo/mutants.toml).

# `> with >= in luhn_valid` is an equivalent mutant, not a test gap: the
# comparison only ever sees the output of `digit *= 2`, every doubled digit is
# even, and `> 9` and `>= 9` differ exactly at 9 — a value doubling a digit
# cannot produce. No test can kill it, so it is excluded here with the proof
# rather than reported as a survivor. The pattern is pinned to the line, so
# moving or rewriting `luhn_valid` re-surfaces the mutant for a fresh
# equivalence check instead of hiding a real gap.
exclude_re = ['crates/detector-regex/src/lib\.rs:63:22: replace > with >= in luhn_valid']
