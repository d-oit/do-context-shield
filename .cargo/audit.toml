# cargo-audit configuration (read from .cargo/audit.toml).
#
# RUSTSEC-2024-0436 is `paste`, unmaintained with no vulnerability, pulled in
# by tokenizers 0.23.2 behind the optional `gliner2` feature. Revisit when
# tokenizers ships without it.
# RUSTSEC-2026-0543 (`chrono` unmaintained, no known vulnerability) is pulled
# only by rmcp, the CLI's test-only MCP client. rmcp 3.10.0 offers no chrono-free
# feature path and no safe upstream upgrade is currently available. Revisit
# when rmcp removes chrono or provides a compatible alternative.
[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0543"]
