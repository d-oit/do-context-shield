# These labels are synced by the labeler workflow (if enabled)
# and used by issue templates.
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: triage
  color: fef2c0
  description: Needs initial review
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file
