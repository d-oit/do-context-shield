---
# Configuration for automated release notes drafting

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Required by release-drafter v6+; without it the workflow fails with
# `"template" is required`.
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: 'Features'
    when:
      labels:
        - 'enhancement'
        - 'feature'
  - title: 'Bug Fixes'
    when:
      labels:
        - 'bug'
        - 'fix'
        - 'bugfix'
  - title: 'Security'
    when:
      labels:
        - 'security'
  - title: 'Maintenance'
    when:
      labels:
        - 'chore'
        - 'deps'
        - 'dependencies'
        - 'refactor'
  - title: 'Documentation'
    when:
      labels:
        - 'documentation'
        - 'docs'
  # v7 moved version resolution onto categories: a matching category's
  # `semver-increment` contributes, and the highest match wins. These
  # resolver-only categories reproduce the label lists the removed
  # top-level `version-resolver` key used, without rendering a section.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'enhancement'
        - 'feature'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'bug'
        - 'patch'
        - 'chore'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
