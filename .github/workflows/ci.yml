---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runtime-backed tests (detector-gliner2 behind --all-features) skip
      # without a loadable ONNX Runtime, so the pinned archive is provisioned
      # here and DO_HARNESS_REQUIRE_ORT turns a broken download into a failure.
      - name: Cache ONNX Runtime
        id: ort
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/onnxruntime-linux-x64-1.28.0
          key: onnxruntime-1.28.0-linux-x64
      - name: Fetch ONNX Runtime 1.28.0
        if: steps.ort.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o "$RUNNER_TEMP/ort.tgz" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
      - run: cargo test --workspace --all-features
        env:
          ORT_DYLIB_PATH: ${{ runner.temp }}/onnxruntime-linux-x64-1.28.0/lib/libonnxruntime.so
          DO_HARNESS_REQUIRE_ORT: "1"

  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --no-fail-fast
      # The Linux jobs compile --all-features; the matrix must too, so the
      # feature-gated gliner2/ort path is platform-checked before merge.
      - name: Check feature-gated code
        run: cargo check --workspace --all-features --all-targets

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  structure:
    name: Structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 scripts/validate-structure.py

  harness:
    name: Harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install do-harness (pinned)
        run: |
          curl -fsSL https://raw.githubusercontent.com/d-o-hub/do-harness/32120c3644ac30236970809e2745981657efd5a7/scripts/install.sh \
            | sh -s -- --version v0.1.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Summarize CI sensor selection
        run: |
          {
            echo '### do-harness CI sensor selection'
            echo
            echo 'The `ci` signal set runs without `--changed`; every listed sensor is selected.'
            echo
            echo '```json'
            do-harness explain --set ci --format json
            echo '```'
            echo
            echo 'The detached `fuzz/` workspace is checked separately by the `fuzz-check` job.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the sensor set
        run: do-harness verify --set ci --format json --strict
      - name: Evidence freshness
        run: do-harness status --set ci

  fuzz-check:
    name: Fuzz targets check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # The fuzz workspace is detached from the root workspace; this same
      # script backs the local `fuzz-check` sensor.
      - name: Check fuzz workspace
        run: bash scripts/check-fuzz.sh

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Node and the MCP Inspector version are pinned in the script (22.x,
      # inspector 2.13.0): never `npx` latest-at-runtime in CI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run the stdio conformance gate
        run: bash scripts/check-mcp-conformance.sh
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-conformance
          path: target/mcp-conformance/
          if-no-files-found: warn

  publish-check:
    name: Publish check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # NOTE: `cargo publish --dry-run` cannot validate workspace crates that
      # depend on unpublished siblings (crates.io index lookup fails), so CI
      # checks the package surface, release preflight, and smoke tests instead.
      - name: Run release preflight
        run: bash scripts/check-release-preflight.sh
      - name: Run release smoke test
        run: bash scripts/smoke-test-release.sh

  ci-success:
    name: CI Success
    needs: [test, cross-platform, deny, structure, harness, fuzz-check, mcp-conformance, publish-check]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          for res in "${{ needs.test.result }}" "${{ needs.cross-platform.result }}" "${{ needs.deny.result }}" "${{ needs.structure.result }}" "${{ needs.harness.result }}" "${{ needs.fuzz-check.result }}" "${{ needs.mcp-conformance.result }}" "${{ needs.publish-check.result }}"; do
            if [ "$res" != "success" ]; then
              echo "Required CI job did not succeed: $res"
              exit 1
            fi
          done
          echo "All CI jobs passed."
