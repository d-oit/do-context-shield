---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The runtime-backed tests (detector-gliner2 behind --all-features) skip
      # without a loadable ONNX Runtime, so the pinned archive is provisioned
      # here and DO_HARNESS_REQUIRE_ORT turns a broken download into a failure.
      - name: Cache ONNX Runtime
        id: ort
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/onnxruntime-linux-x64-1.28.0
          key: onnxruntime-1.28.0-linux-x64
      - name: Fetch ONNX Runtime 1.28.0
        if: steps.ort.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o "$RUNNER_TEMP/ort.tgz" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
      - run: cargo test --workspace --all-features
        env:
          ORT_DYLIB_PATH: ${{ runner.temp }}/onnxruntime-linux-x64-1.28.0/lib/libonnxruntime.so
          DO_HARNESS_REQUIRE_ORT: "1"

  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --no-fail-fast
      # The Linux jobs compile --all-features; the matrix must too, so the
      # feature-gated gliner2/ort path is platform-checked before merge.
      - name: Check feature-gated code
        run: cargo check --workspace --all-features --all-targets

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  structure:
    name: Structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 scripts/validate-structure.py

  harness:
    name: Harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: Install do-harness (pinned)
        run: |
          curl -fsSL https://raw.githubusercontent.com/d-o-hub/do-harness/32120c3644ac30236970809e2745981657efd5a7/scripts/install.sh \
            | sh -s -- --version v0.1.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the sensor set
        run: do-harness verify --set ci --format json --strict
      - name: Evidence freshness
        run: do-harness status --set ci

  fuzz-check:
    name: Fuzz targets check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # The fuzz workspace is detached (root `exclude`), so it is addressed by
      # manifest path. `--locked` fails when fuzz/Cargo.lock is stale. Smoke
      # only: the seed-corpus regression tests and target compilation, never a
      # fuzzing run (that lives in fuzz.yml).
      - name: Self-test the fuzz duration resolver
        run: |
          # stdout is reserved for the duration the workflow captures, so the
          # self-test must not write a message there.
          if [[ -n "$(bash scripts/fuzz-duration.sh self-test 2>/dev/null)" ]]; then
            echo "::error::the resolver self-test wrote to stdout"
            exit 1
          fi
          bash scripts/fuzz-duration.sh self-test
      - name: Check fuzz workspace formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Lint fuzz workspace
        run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings
      - name: Check fuzz targets compilation
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --all-targets
      - name: Run seed-corpus regression tests
        run: cargo test --manifest-path fuzz/Cargo.toml --locked --test seed_corpus

  publish-check:
    name: Publish check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NOTE: `cargo publish --dry-run` cannot validate workspace crates that
      # depend on unpublished siblings (crates.io index lookup fails), so CI
      # checks the package surface, release preflight, and smoke tests instead.
      - name: Run release preflight
        run: bash scripts/check-release-preflight.sh
      - name: Run release smoke test
        run: bash scripts/smoke-test-release.sh

  ci-success:
    name: CI Success
    needs: [test, cross-platform, deny, structure, harness, fuzz-check, publish-check]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          for res in "${{ needs.test.result }}" "${{ needs.cross-platform.result }}" "${{ needs.deny.result }}" "${{ needs.structure.result }}" "${{ needs.harness.result }}" "${{ needs.fuzz-check.result }}" "${{ needs.publish-check.result }}"; do
            if [ "$res" != "success" ]; then
              echo "Required CI job did not succeed: $res"
              exit 1
            fi
          done
          echo "All CI jobs passed."
