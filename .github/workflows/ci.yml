---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/validate-structure.py

  harness:
    name: Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Install do-harness (pinned)
        run: |
          curl -fsSL https://raw.githubusercontent.com/d-o-hub/do-harness/main/scripts/install.sh \
            | sh -s -- --version v0.1.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the sensor set
        run: do-harness verify --set ci --format json --strict
      - name: Evidence freshness
        run: do-harness status --set ci
      - name: Skill evals
        run: do-harness eval --strict-fixtures

  publish-check:
    name: Publish check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # NOTE: `cargo publish --dry-run` cannot validate workspace crates that
      # depend on unpublished siblings (crates.io index lookup fails), so CI
      # checks the package surface and required metadata instead. Real
      # publishing follows the bottom-up order in scripts/publish-crates.sh.
      - name: Verify publish metadata
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          meta = json.loads(subprocess.run(
              ['cargo', 'metadata', '--format-version', '1', '--no-deps'],
              capture_output=True, text=True, check=True).stdout)
          bad = []
          for pkg in meta['packages']:
              if '/crates/' not in pkg['manifest_path']:
                  continue
              for field in ('description', 'license', 'repository'):
                  if not pkg.get(field):
                      bad.append(f"{pkg['name']}: missing {field}")
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('publish metadata ok')
          EOF
      - name: Verify include whitelists
        run: |
          for crate in $(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(' '.join(sorted(p['name'] for p in json.load(sys.stdin)['packages'] if '/crates/' in p['manifest_path'])))"); do
            echo "--- $crate ---"
            cargo package --list -p "$crate"
          done

  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, audit, deny, structure, harness, publish-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          for res in "${{ needs.fmt.result }}" "${{ needs.clippy.result }}" "${{ needs.test.result }}" "${{ needs.audit.result }}" "${{ needs.deny.result }}" "${{ needs.structure.result }}" "${{ needs.harness.result }}" "${{ needs.publish-check.result }}"; do
            if [ "$res" != "success" ]; then
              echo "Required CI job did not succeed: $res"
              exit 1
            fi
          done
          echo "All CI jobs passed."
