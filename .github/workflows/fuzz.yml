---
name: Fuzz

# Heavy job: scheduled and manual only, never on push or pull request. The
# PR-time gate is the `fuzz-check` job in ci.yml, which compiles the targets
# and runs the committed seed-corpus regression tests.
on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per fuzz target (digits only; capped at 3600)"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  # Hard ceiling per target, applied in the shell regardless of the input.
  FUZZ_MAX_SECONDS: "3600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # Build time plus the 3600 s ceiling, with headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_detector_regex
          - fuzz_sanitize_pipeline
          - fuzz_vault_json
          - fuzz_mcp_parse
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Resolve fuzz duration
        env:
          REQUESTED: ${{ inputs.duration }}
        run: |
          requested="${REQUESTED:-300}"
          if [[ ! "$requested" =~ ^[0-9]+$ ]]; then
            echo "::error::duration must be a whole number of seconds, got '$requested'"
            exit 1
          fi
          # 10# forces base 10 so a leading zero is not read as octal.
          requested=$((10#$requested))
          if (( requested == 0 )); then
            echo "::error::duration must be at least 1 second"
            exit 1
          fi
          if (( requested > FUZZ_MAX_SECONDS )); then
            requested=$FUZZ_MAX_SECONDS
          fi
          echo "FUZZ_SECONDS=$requested" >> "$GITHUB_ENV"
          echo "::notice::fuzzing ${{ matrix.target }} for ${requested}s"
      - name: Fuzz target
        env:
          TARGET: ${{ matrix.target }}
        # The first corpus directory is scratch space that receives new inputs
        # for this run. The committed seeds are read-only inputs, so the
        # repository corpus never changes in CI.
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/$TARGET"
          cargo fuzz run "$TARGET" \
            "$RUNNER_TEMP/corpus/$TARGET" \
            "fuzz/corpus/$TARGET" \
            -- -max_total_time="$FUZZ_SECONDS"
      - name: Preserve crash reproducers
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
