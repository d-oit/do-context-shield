---
name: Fuzz

# Heavy job: scheduled and manual only, never on push or pull request. The
# PR-time gate is the `fuzz-check` job in ci.yml, which compiles the targets
# and runs the committed seed-corpus regression tests.
on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per fuzz target (digits only; capped at 3600)"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  # Hard ceiling per target, applied in the shell regardless of the input.
  FUZZ_MAX_SECONDS: "3600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # Build time plus the 3600 s ceiling, with headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_detector_regex
          - fuzz_sanitize_pipeline
          - fuzz_vault_json
          - fuzz_mcp_parse
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Resolve fuzz duration
        env:
          REQUESTED: ${{ inputs.duration }}
        # The resolver compares digit strings before any shell arithmetic: a
        # request like 18446744073709551615 used to wrap to -1 (neither zero
        # nor above the cap) and reach libFuzzer as `-max_total_time=-1`, which
        # libFuzzer treats as no limit at all.
        run: |
          resolved="$(bash scripts/fuzz-duration.sh "$REQUESTED")"
          echo "FUZZ_SECONDS=$resolved" >> "$GITHUB_ENV"
          echo "::notice::fuzzing ${{ matrix.target }} for ${resolved}s"
      - name: Fuzz target
        # A hard bound independent of the resolver: the step cannot outlive the
        # 3600 s cap plus a nightly build, whatever FUZZ_SECONDS says.
        timeout-minutes: 75
        env:
          TARGET: ${{ matrix.target }}
        # The first corpus directory is scratch space that receives new inputs
        # for this run. The committed seeds are read-only inputs, so the
        # repository corpus never changes in CI.
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/$TARGET"
          cargo fuzz run "$TARGET" \
            "$RUNNER_TEMP/corpus/$TARGET" \
            "fuzz/corpus/$TARGET" \
            -- -max_total_time="$FUZZ_SECONDS"
      - name: Preserve crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
