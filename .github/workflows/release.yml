---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Run release preflight
        run: bash scripts/check-release-preflight.sh "${{ inputs.tag_name || github.ref_name }}"

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            exe_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            exe_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            exe_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            exe_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p do-context-shield

      - name: Smoke test release binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/do-context-shield${{ matrix.exe_ext }}"
          bash scripts/smoke-test-release.sh "$BIN_PATH"

      - name: Package artifact
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          PKG_NAME="do-context-shield-${TAG_NAME}-${{ matrix.target }}"
          DIST_DIR="target/dist"
          mkdir -p "$DIST_DIR"

          BIN_FILE="target/${{ matrix.target }}/release/do-context-shield${{ matrix.exe_ext }}"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$BIN_FILE', 'LICENSE', 'README.md' -DestinationPath '$DIST_DIR/${PKG_NAME}.zip'"
          else
            tar -czf "$DIST_DIR/${PKG_NAME}.tar.gz" -C "target/${{ matrix.target }}/release" "do-context-shield${{ matrix.exe_ext }}" -C "$PWD" LICENSE README.md
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: binary-${{ matrix.target }}
          path: target/dist/*
          retention-days: 7

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download all binary artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          echo "Publishing release assets for $TAG_NAME..."
          gh release create "$TAG_NAME" release-artifacts/* --title "$TAG_NAME" --notes "Release $TAG_NAME" --draft=false || \
          gh release upload "$TAG_NAME" release-artifacts/* --clobber

  publish-crates-io:
    name: Publish to crates.io
    needs: [preflight]
    runs-on: ubuntu-24.04
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh
