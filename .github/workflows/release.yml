---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      publish_crates:
        description: 'Publish crates to crates.io (disable when the first publish was done locally)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Run release preflight
        run: bash scripts/check-release-preflight.sh "${{ inputs.tag_name || github.ref_name }}"

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            exe_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            exe_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            exe_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            exe_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Match rust-toolchain.toml: `cargo` runs the pinned 1.88.0, so the
          # cross target must be installed for that toolchain rather than for
          # the action's default stable (otherwise macOS x86_64 hits E0463).
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p do-context-shield

      - name: Smoke test release binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/do-context-shield${{ matrix.exe_ext }}"
          bash scripts/smoke-test-release.sh "$BIN_PATH"

      - name: Package artifact
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          PKG_NAME="do-context-shield-${TAG_NAME}-${{ matrix.target }}"
          DIST_DIR="target/dist"
          mkdir -p "$DIST_DIR"

          BIN_FILE="target/${{ matrix.target }}/release/do-context-shield${{ matrix.exe_ext }}"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$BIN_FILE', 'LICENSE', 'README.md' -DestinationPath '$DIST_DIR/${PKG_NAME}.zip'"
          else
            tar -czf "$DIST_DIR/${PKG_NAME}.tar.gz" -C "target/${{ matrix.target }}/release" "do-context-shield${{ matrix.exe_ext }}" -C "$PWD" LICENSE README.md
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: target/dist/*
          retention-days: 7

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          echo "Publishing release assets for $TAG_NAME..."
          gh release create "$TAG_NAME" release-artifacts/* --title "$TAG_NAME" --notes "Release $TAG_NAME" --draft=false || \
          gh release upload "$TAG_NAME" release-artifacts/* --clobber

  publish-crates-io:
    name: Publish to crates.io
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Tag pushes always publish. A manual dispatch can opt out when the first
    # publish of a new crate was done locally (trusted publishing can only be
    # configured after the crate exists).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_crates }}
    # crates.io trusted publishing: exchange this job's GitHub OIDC token for a
    # short-lived registry token. No long-lived CARGO_REGISTRY_TOKEN secret is
    # stored in the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Check whether publishing is needed
        id: publish-needed
        run: |
          if bash scripts/publish-crates.sh --needs-publish; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.publish-needed.outputs.needed == 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish workspace crates
        if: steps.publish-needed.outputs.needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: bash scripts/publish-crates.sh
