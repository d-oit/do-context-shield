---
name: Mutation Testing

# Heavy job: scheduled and manual only, never on push or pull request. Mutation
# results are a signal for adding behavioral tests, not a merge gate.
on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants

      # cargo-mutants exit codes (src/exit_code.rs): 0 = every mutant caught,
      # 2 = one or more mutants survived (a test gap, reported), anything else
      # (1 usage, 3 timeout, 4 baseline failed, 70 internal) = the tool or the
      # setup failed and must fail the job. Surviving mutants never fail it.
      - name: Run mutation tests on security-critical crates
        id: mutants
        run: |
          set +e
          cargo mutants \
            --package do-context-shield-detector-regex \
            --package do-context-shield-core \
            --package do-context-shield-plugin-api \
            --package do-context-shield-policy-default \
            --package do-context-shield-policy-matrix \
            --package do-context-shield-vault-json \
            --package do-context-shield-vault-memory \
            --package do-context-shield-transformer-generalize \
            --package do-context-shield-transformer-mask \
            --package do-context-shield-transformer-pseudonymize \
            --jobs 2 \
            --timeout-multiplier 3
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0)
              echo "::notice::cargo-mutants: all mutants caught" ;;
            2)
              echo "::warning::cargo-mutants: surviving mutants found; see the mutants-report artifact" ;;
            *)
              echo "::error::cargo-mutants failed to run to a verdict (exit $status)"
              exit "$status" ;;
          esac

      - name: Upload mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 30
