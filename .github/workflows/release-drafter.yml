---
# Auto-draft release notes from merged PRs
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    name: Draft Release Notes
    runs-on: ubuntu-24.04
    # Only the push-to-main path writes the draft; pull requests are covered by
    # the dry-run job below.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml

  # Same action, same config, no writes. GitHub renders the action's
  # `::warning::` lines as check annotations, so an action bump or a config
  # change shows its Node-runtime, webhook-name, and deprecation warnings on
  # the pull request instead of after the merge. The config is read from the
  # pull request's merge ref, i.e. exactly what a post-merge push would use.
  dry_run:
    name: Release Drafter (dry run)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          dry-run: true
