[workspace]
members = ["crates/*"]
default-members = ["crates/do-context-shield-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
version = "0.1.0"
authors = ["d-oit"]
description = "Local privacy boundary for coding agents — detect, transform, and vault sensitive context on-device"
homepage = "https://github.com/d-oit/do-context-shield"
repository = "https://github.com/d-oit/do-context-shield"
keywords = ["privacy", "mcp", "agents", "local-first", "dlp"]
categories = ["command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
