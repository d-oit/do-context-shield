[workspace]
members = ["crates/*"]
default-members = ["crates/do-context-shield-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
version = "0.1.0"
authors = ["d-oit"]
description = "Local privacy boundary for coding agents — detect, transform, and vault sensitive context on-device"
homepage = "https://github.com/d-oit/do-context-shield"
repository = "https://github.com/d-oit/do-context-shield"
keywords = ["privacy", "mcp", "agents", "local-first", "dlp"]
categories = ["command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
# OS entropy for unguessable placeholder tokens (`mint_placeholder`).
getrandom = "0.3"
# Fragment orchestrator for GLiNER2 span exports (encoder + 7 fragments).
# `default-features = false` keeps the hf-hub download stack (and its TLS
# dependencies) out of the binary: the privacy boundary never fetches models.
gliner2-rs = { version = "0.9", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
  "load-dynamic",
] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokenizers = "0.23"
toml = "0.8"
# Intra-workspace crates. Versions are duplicated from [workspace.package]
# so path dependencies carry an explicit requirement (cargo-deny bans
# wildcards; publishing also requires it).
do-context-shield-core = { path = "crates/privacy-core", version = "0.1.0" }
do-context-shield-detector-regex = { path = "crates/detector-regex", version = "0.1.0" }
do-context-shield-detector-gliner2 = { path = "crates/detector-gliner2", version = "0.1.0" }
do-context-shield-detector-hybrid = { path = "crates/detector-hybrid", version = "0.1.0" }
do-context-shield-judge-heuristics = { path = "crates/judge-heuristics", version = "0.1.0" }
do-context-shield-mcp-server = { path = "crates/mcp-server", version = "0.1.0" }
do-context-shield-plugin-api = { path = "crates/plugin-api", version = "0.1.0" }
do-context-shield-plugin-process = { path = "crates/plugin-process", version = "0.1.0" }
do-context-shield-plugin-registry = { path = "crates/plugin-registry", version = "0.1.0" }
do-context-shield-policy-default = { path = "crates/policy-default", version = "0.1.0" }
do-context-shield-transformer-pseudonymize = { path = "crates/transformer-pseudonymize", version = "0.1.0" }
do-context-shield-vault-json = { path = "crates/vault-json", version = "0.1.0" }
do-context-shield-vault-memory = { path = "crates/vault-memory", version = "0.1.0" }
