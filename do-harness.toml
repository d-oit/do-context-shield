language = "rust"

[hooks]
pre-commit = ["fmt", "check", "loc"]
pre-push = ["fmt", "check", "clippy", "test", "loc", "shellcheck", "hooks", "deps", "audit", "publish-order", "commitlint"]

[signal-sets]
feedback = ["fmt", "check", "clippy"]
verification = ["fmt", "check", "clippy", "test", "loc", "shellcheck", "hooks", "skills", "skill-evals", "deps", "audit", "publish-order", "commitlint"]
release = ["fmt", "check", "clippy", "test", "loc", "shellcheck", "hooks", "skills", "skill-evals", "deps", "audit", "publish-order", "commitlint"]
# CI runs the same set minus commitlint: pull_request checkouts are merge refs,
# so `git log --no-merges -n 1` lints the contributor's commit subject, while
# this repository's policy enforces conventional PR *titles* (commitlint.yml)
# and lints commits locally via the commit-msg hook and the verification set.
ci = ["fmt", "check", "clippy", "test", "loc", "shellcheck", "hooks", "skills", "skill-evals", "deps", "audit", "publish-order"]

[[sensors]]
name = "fmt"
argv = ["cargo", "fmt", "--all", "--", "--check"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[sensors]]
name = "check"
argv = ["cargo", "check", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "clippy"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "test"
argv = ["cargo", "test", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "loc"
argv = ["bash", "scripts/check-loc.sh"]
when-changed = ["**/*.rs"]

[[sensors]]
name = "shellcheck"
argv = ["bash", "scripts/check-shellcheck.sh"]
when-changed = ["**/*.sh", ".githooks/**", "scripts/check-shellcheck.sh"]

[[sensors]]
name = "skills"
argv = ["bash", "scripts/check-skills.sh"]
when-changed = [".agents/skills/**", ".agents/SKILLS.md", "plans/methods.json", "plans/invariants.json", "do-harness.toml", "scripts/check-skills.sh"]

[[sensors]]
name = "skill-evals"
argv = ["bash", "scripts/check-skill-evals.sh"]
when-changed = [".agents/skills/**", ".agents/SKILLS.md", "plans/methods.json", "plans/invariants.json", "do-harness.toml", "scripts/check-skills.sh", "scripts/check-skill-evals.sh"]

[[sensors]]
name = "hooks"
argv = ["bash", "scripts/check-hooks.sh"]
when-changed = [".githooks/**", "scripts/check-hooks.sh", "do-harness.toml"]

[[sensors]]
name = "deps"
argv = ["bash", "scripts/check-deps.sh"]

[[sensors]]
name = "audit"
argv = ["bash", "scripts/check-audit.sh"]

[[sensors]]
name = "publish-order"
argv = ["bash", "scripts/check-publish-order.sh"]
when-changed = ["scripts/publish-crates.sh", "scripts/check-publish-order.sh", "crates/*/Cargo.toml", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "commitlint"
argv = ["bash", "scripts/check-commitlint.sh"]
