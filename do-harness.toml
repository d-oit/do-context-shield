language = "rust"

[hooks]
pre-commit = ["fmt", "check", "loc"]
pre-push = ["fmt", "check", "clippy", "test", "loc", "shellcheck", "hooks", "deps", "audit", "publish-order", "commitlint"]

[signal-sets]
feedback = ["fmt", "check", "clippy"]
verification = ["fmt", "check", "clippy", "test", "opencode-egress", "loc", "shellcheck", "hooks", "skills", "skill-evals", "shared-skills", "deps", "audit", "publish-order", "release-preflight", "backlog", "fuzz-check", "security-regression", "commitlint"]
release = ["fmt", "check", "clippy", "test", "opencode-egress", "loc", "shellcheck", "hooks", "skills", "skill-evals", "shared-skills", "deps", "audit", "publish-order", "release-preflight", "backlog", "fuzz-check", "security-regression", "commitlint"]
# CI runs the same set minus commitlint and fuzz-check: pull_request checkouts
# are merge refs, so `git log --no-merges -n 1` lints the contributor's commit
# subject, while this repository enforces conventional PR titles. The detached
# fuzz workspace remains a separate CI job.
ci = ["fmt", "check", "clippy", "test", "opencode-egress", "loc", "shellcheck", "hooks", "skills", "skill-evals", "shared-skills", "deps", "audit", "publish-order", "release-preflight", "backlog", "security-regression"]

[[sensors]]
name = "fmt"
argv = ["cargo", "fmt", "--all", "--", "--check"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[sensors]]
name = "check"
argv = ["cargo", "check", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml"]

[[sensors]]
name = "clippy"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml"]

[[sensors]]
name = "test"
argv = ["cargo", "test", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml", "quality/corpus/**", "crates/do-context-shield-cli/tests/fixtures/**", "crates/plugin-process/tests/fixtures/**"]

[[sensors]]
name = "opencode-egress"
argv = ["bash", "scripts/check-opencode-egress.sh"]
when-changed = ["adapters/opencode-egress/**", "scripts/check-opencode-egress.sh", "Cargo.toml", "Cargo.lock", "crates/**"]

[[sensors]]
name = "loc"
argv = ["bash", "scripts/check-loc.sh"]
when-changed = ["**/*.rs"]

[[sensors]]
name = "shellcheck"
argv = ["bash", "scripts/check-shellcheck.sh"]
when-changed = ["**/*.sh", ".githooks/**", "scripts/check-shellcheck.sh"]

[[sensors]]
name = "skills"
argv = ["bash", "scripts/check-skills.sh"]
when-changed = [".agents/skills/**", ".agents/SKILLS.md", "plans/methods.json", "plans/invariants.json", "do-harness.toml", "scripts/check-skills.sh", "tests/test_shared_skills.py", "tests/fixtures/shared-skills/**"]

[[sensors]]
name = "skill-evals"
argv = ["bash", "scripts/check-skill-evals.sh"]
when-changed = [".agents/skills/**", ".agents/SKILLS.md", "plans/methods.json", "plans/invariants.json", "do-harness.toml", "scripts/check-skills.sh", "scripts/check-skill-evals.sh"]

[[sensors]]
name = "shared-skills"
argv = ["bash", "scripts/check-shared-skills.sh"]
when-changed = [".agents/exported-skills.json", ".agents/skills/**", "scripts/check-shared-skills.sh"]

[[sensors]]
name = "hooks"
argv = ["bash", "scripts/check-hooks.sh"]
when-changed = [".githooks/**", "scripts/check-hooks.sh", "do-harness.toml"]

[[sensors]]
name = "deps"
argv = ["bash", "scripts/check-deps.sh"]

[[sensors]]
name = "audit"
argv = ["bash", "scripts/check-audit.sh"]

[[sensors]]
name = "publish-order"
argv = ["bash", "scripts/check-publish-order.sh"]
when-changed = ["Cargo.toml", "scripts/publish-crates.sh", "scripts/check-publish-order.sh", "**/Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "release-preflight"
argv = ["bash", "scripts/check-release-preflight.sh"]
when-changed = ["scripts/check-release-preflight.sh", "scripts/publish-crates.sh", "scripts/check-publish-order.sh", "crates/*/Cargo.toml", "crates/*/README.md", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "backlog"
argv = ["bash", "scripts/check-backlog.sh"]
when-changed = ["plans/backlog.md", "docs/decisions/**", "docs/test-evidence/**", "scripts/backlog_validation.py", "scripts/check-backlog.sh", "tests/test_backlog_validation.py"]

[[sensors]]
name = "fuzz-check"
argv = ["bash", "scripts/check-fuzz.sh"]
when-changed = ["fuzz/**"]

[[sensors]]
name = "security-regression"
argv = ["bash", "scripts/check-security-regression.sh"]

[[sensors]]
name = "commitlint"
argv = ["bash", "scripts/check-commitlint.sh"]
