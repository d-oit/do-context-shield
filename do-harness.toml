language = "rust"

[hooks]
pre-commit = ["fmt", "check"]
pre-push = ["fmt", "check", "clippy", "test"]

[signal-sets]
feedback = ["fmt", "check", "clippy"]
verification = ["fmt", "check", "clippy", "test"]
release = ["fmt", "check", "clippy", "test"]

[[sensors]]
name = "fmt"
argv = ["cargo", "fmt", "--all", "--", "--check"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[sensors]]
name = "check"
argv = ["cargo", "check", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "clippy"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "test"
argv = ["cargo", "test", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock"]
