[package]
name = "do-context-shield"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local privacy boundary CLI for coding agents (sanitize, restore, inspect, mcp-stdio)"
homepage.workspace = true
repository.workspace = true
include = ["src/**/*", "Cargo.toml"]

[[bin]]
name = "do-context-shield"
path = "src/main.rs"

[features]
# Build the CLI with the GLiNER2 ONNX backend enabled. The model-backed
# end-to-end test target below additionally needs ORT_DYLIB_PATH and
# DO_CONTEXT_SHIELD_E2E_MODEL_DIR at run time (see docs/plugins.md).
gliner2 = ["do-context-shield-detector-gliner2/gliner2"]

[[test]]
name = "cli_model_e2e"
required-features = ["gliner2"]

[[test]]
name = "mcp_model_e2e"
required-features = ["gliner2"]

[lints]
workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
do-context-shield-core.workspace = true
do-context-shield-detector-gliner2.workspace = true
do-context-shield-detector-hybrid.workspace = true
do-context-shield-plugin-process.workspace = true
do-context-shield-plugin-api.workspace = true
do-context-shield-plugin-registry.workspace = true
do-context-shield-vault-json.workspace = true
do-context-shield-mcp-server.workspace = true

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3"
tempfile = "3"
